version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: finance-postgres
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password_2024
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-backend
    environment:
      - DATABASE_URL=postgresql://finance_user:finance_password_2024@postgres:5432/finance_db?sslmode=disable
      - SECRET_KEY=your-secret-key-change-in-production-2024
      - ENVIRONMENT=production
      - FRONTEND_URL=https://finance.projdev.site
      - ALLOWED_ORIGINS=https://finance.projdev.site,http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    environment:
      - VITE_API_URL=https://finance.projdev.site
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
